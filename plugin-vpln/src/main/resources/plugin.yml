name: FreeSkyVPLN
version: '1.0.0'
main: pl.freesky.vpln.FreeSkyVpln
api-version: '1.21'
description: Własna waluta VPLN, GUI /portfel i czasowy mnożnik nagród.
author: FreeSky
commands:
  portfel:
    description: Otwiera sklep VPLN.
    aliases: [wallet, vplnshop]
    usage: /portfel
  vpln:
    description: Saldo, administracja walutą i mnożnik nagród.
    usage: /vpln help
    aliases: [vplnadmin]
permissions:
  freeskyvpln.admin:
    description: Zarządzanie saldami VPLN i mnożnikiem nagród.
    default: op
