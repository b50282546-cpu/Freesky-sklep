# FreeSky VPLN - ustawienia sklepu i ogłoszeń.
# Produkty edytuj w sekcji shop. Cena jest w VPLN.
# Jeśli produkt ma komendy w "commands", zostaną wykonane jako konsola po zakupie.
# Dostępne placeholdery komend: %player%, %uuid%, %amount%.
# Produkty komendowe można podłączyć do pluginu rang/kluczy; sprawdź komendy danego pluginu.

announcements:
  title: "&a&lZAKUP NA FREESKY!"
  subtitle: "&f%player% &7kupił &a%product% &7za &e%price% VPLN"

# Mnożnik dotyczy nagród wydawanych przez /vpln earn i publiczną metodę deposit(..., true).
# ends-at to data końca w milisekundach Unix; nie zmieniaj ręcznie w trakcie eventu.
multiplier:
  value: 1.0
  ends-at: 0

