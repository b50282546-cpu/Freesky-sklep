name: Build FreeSky VPLN plugin

on:
  workflow_dispatch:
  push:
    paths:
      - 'plugin-vpln/**'
      - '.github/workflows/build-vpln.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build plugin
        working-directory: plugin-vpln
        run: mvn --batch-mode clean package
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: FreeSkyVPLN-1.0.0
          path: plugin-vpln/target/FreeSkyVPLN-1.0.0.jar
          if-no-files-found: error
